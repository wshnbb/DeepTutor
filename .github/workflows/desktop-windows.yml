name: Desktop Windows

on:
  workflow_dispatch:
  push:
    branches: [desktop]
    paths:
      - "desktop/**"
      - "deeptutor/runtime/launcher.py"
      - ".github/workflows/desktop-windows.yml"

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.repository == 'wshnbb/DeepTutor'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop build tools
        working-directory: desktop
        run: npm ci
      - name: Test native origin and navigation guards
        working-directory: desktop
        run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
      - name: Install packaging tools
        run: python -m pip install --upgrade pip build psutil
      - name: Validate desktop runtime contracts
        run: python -m unittest discover -s desktop/tests -p 'test_*.py' -v
      - name: Install Web dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps
      - name: Build production Web app
        working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: __NEXT_PUBLIC_API_BASE_PLACEHOLDER__
          NEXT_PUBLIC_AUTH_ENABLED: __NEXT_PUBLIC_AUTH_ENABLED_PLACEHOLDER__
      - name: Package production Web app
        run: python scripts/prepare_web_package.py --skip-build
      - name: Build Python wheel from this commit
        working-directory: ${{ runner.temp }}
        run: python -m build --wheel --outdir "$env:GITHUB_WORKSPACE/desktop/dist" "$env:GITHUB_WORKSPACE"
      - name: Assemble portable runtime
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -LiteralPath desktop/dist -Filter '*.whl' | Select-Object -First 1
          python desktop/scripts/prepare_runtime.py --wheel $wheel.FullName
      - name: Verify real packaged runtime
        run: python desktop/scripts/smoke_runtime.py --runtime desktop/src-tauri/runtime
      - name: Generate desktop icons
        working-directory: desktop
        run: npx tauri icon ui/icon.svg --output src-tauri/icons
      - name: Build Windows installer
        working-directory: desktop
        run: npm run build -- --bundles nsis
      - name: Verify installed native desktop
        working-directory: desktop
        run: node tests/native-smoke.mjs
        env:
          DESKTOP_EVIDENCE: ${{ runner.temp }}/desktop-evidence
      - name: Write installer checksums
        shell: pwsh
        run: |
          Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)" | Out-File -LiteralPath "$($_.FullName).sha256" -Encoding utf8
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DeepTutor-Desktop-Windows-x64-${{ github.run_number }}
          retention-days: 14
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sha256
            desktop/src-tauri/runtime/manifest.json
            desktop/src-tauri/Cargo.lock
      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeepTutor-Desktop-Test-Evidence-${{ github.run_number }}
          path: ${{ runner.temp }}/desktop-evidence
          if-no-files-found: ignore
